name: NPS acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify NPS
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true

      - name: Test NPS packages
        run: >-
          go test
          ./bridge ./client ./cmd/nps ./lib/cache ./lib/common ./lib/config ./lib/conn
          ./lib/crypt ./lib/daemon ./lib/file ./lib/goroutine ./lib/install
          ./lib/pmux ./lib/rate ./lib/sheap ./lib/version ./server ./server/connection
          ./server/proxy ./server/test ./server/tool ./web/controllers ./web/routers

      - name: Race-test shared runtime state
        run: >-
          go test -race
          ./lib/file ./lib/pmux ./lib/rate
          ./server ./server/proxy ./web/controllers

      - name: Vet NPS packages
        run: >-
          go vet
          ./bridge ./cmd/nps ./lib/cache ./lib/common ./lib/config ./lib/conn
          ./lib/crypt ./lib/daemon ./lib/file ./lib/goroutine ./lib/install
          ./lib/pmux ./lib/rate ./lib/sheap ./lib/version ./server ./server/connection
          ./server/proxy ./server/test ./server/tool ./web/controllers ./web/routers

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./bridge ./cmd/nps ./lib/... ./server/... ./web/...

      - name: Validate Dockerfile
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Check Docker build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.nps
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=nps-acceptance
          cache-to: type=gha,mode=max,scope=nps-acceptance
