<div class="wrapper wrapper-content animated fadeInRight">

    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5 langtag="page-clientlist"></h5>

                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                        <a class="close-link">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                </div>
            <div class="content">
            {{if eq true .isAdmin}}

                <div class="table-responsive">
                    <div id="toolbar">
                        <a href="{{.web_base_url}}/client/add" class="btn btn-primary dim">
                        <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span></a>
                        <a href="javascript:void(0)" class="btn btn-primary dim" onclick="openBatchBasicDialog(); return false;">
                            <i class="fa fa-fw fa-lg fa-key"></i> Basic
                        </a>
                    </div>
                </div>
            </div>
            {{end}}
                <div class="ibox-content">

                    <table id="table"></table>

                </div>
            </div>
        </div>
    </div>
</div>

{{if eq true .isAdmin}}
<div class="modal fade" id="basicAuthModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="basicAuthModalTitle">Basic</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="basic_client_ids">
                <div class="form-group">
                    <label class="font-bold" langtag="word-basicusername"></label>
                    <input class="form-control" type="text" id="basic_username">
                </div>
                <div class="form-group">
                    <label class="font-bold" langtag="word-basicpassword"></label>
                    <input class="form-control" type="text" id="basic_password">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-white" data-dismiss="modal"><span langtag="word-close"></span></button>
                <button type="button" class="btn btn-primary" onclick="submitBasicAuth(); return false;">
                    <i class="fa fa-save"></i> <span langtag="word-save"></span>
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}

<script>
    function escapeHtml(value) {
        if (typeof window.npsEscapeHtml === 'function') {
            return window.npsEscapeHtml(value)
        }
        return $('<div>').text(value == null ? '' : String(value)).html()
    }

    function verifyKeyMaskHtml(value) {
        return '<span class="verify-key-wrap" style="white-space: nowrap;">'
            + '<span class="verify-key-value" data-secret="' + escapeHtml(value) + '" data-visible="0">********</span>'
            + ' <button type="button" class="btn btn-outline btn-primary btn-xs" onclick="toggleVerifyKey(this); return false;" title="show/hide">'
            + '<i class="fa fa-eye"></i></button></span>'
    }

    function clientCommandHtml(row) {
        var prefix = './npc{{.win}} -server={{.ip}}:{{.p}} -vkey='
        var suffix = ' -type={{.bridgeType}}'
        return '<span class="verify-key-wrap" style="white-space: nowrap;">'
            + '<code>' + escapeHtml(prefix)
            + '<span class="verify-key-value" data-secret="' + escapeHtml(row.VerifyKey) + '" data-visible="0">********</span>'
            + escapeHtml(suffix) + '</code>'
            + ' <button type="button" class="btn btn-outline btn-primary btn-xs" onclick="toggleVerifyKey(this); return false;" title="show/hide">'
            + '<i class="fa fa-eye"></i></button></span>'
    }

    function toggleVerifyKey(button) {
        var $button = $(button)
        var $value = $button.closest('.verify-key-wrap').find('.verify-key-value').first()
        var visible = $value.attr('data-visible') === '1'
        if (visible) {
            $value.text('********')
            $value.attr('data-visible', '0')
            $button.find('i').removeClass('fa-eye-slash').addClass('fa-eye')
        } else {
            $value.text($value.attr('data-secret'))
            $value.attr('data-visible', '1')
            $button.find('i').removeClass('fa-eye').addClass('fa-eye-slash')
        }
    }

    function clientBasicValue(row, field) {
        if (!row || !row.Cnf) {
            return ''
        }
        var value = row.Cnf[field]
        return value == null ? '' : value
    }

    function findClientRow(id) {
        var rows = $('#table').bootstrapTable('getData') || []
        for (var i = 0; i < rows.length; i++) {
            if (Number(rows[i].Id) === Number(id)) {
                return rows[i]
            }
        }
        return null
    }

    function openBasicAuthDialog(ids, username, password, title) {
        $('#basic_client_ids').val(ids.join(','))
        $('#basic_username').val(username || '')
        $('#basic_password').val(password || '')
        $('#basicAuthModalTitle').text(title || 'Basic')
        $('#basicAuthModal').modal('show')
    }

    function openClientBasicDialog(id) {
        var row = findClientRow(id)
        openBasicAuthDialog([id], clientBasicValue(row, 'U'), clientBasicValue(row, 'P'), 'Basic #' + id)
    }

    function openBatchBasicDialog() {
        var rows = $('#table').bootstrapTable('getSelections') || []
        if (rows.length === 0) {
            alert('select client first')
            return
        }
        var ids = $.map(rows, function (row) {
            return row.Id
        })
        openBasicAuthDialog(ids, '', '', 'Batch Basic (' + ids.length + ')')
    }

    function submitBasicAuth() {
        $.ajax({
            type: 'POST',
            url: '{{.web_base_url}}/client/basic',
            data: {
                ids: $('#basic_client_ids').val(),
                u: $('#basic_username').val(),
                p: $('#basic_password').val()
            },
            success: function (res) {
                alert(langreply(res.msg))
                if (res.status) {
                    $('#basicAuthModal').modal('hide')
                    $('#table').bootstrapTable('refresh')
                }
            }
        })
    }

    /*bootstrap table*/
    $('#table').bootstrapTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        search: true,
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50],//分页步进值
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        onExpandRow: function () {$('body').setLang ('.detail-view');},
        onPostBody: function (data) { if ($(this)[0].locale != undefined ) $('body').setLang ('#table'); },
        detailFormatter: function (index, row, element) {
            return '<b langtag="word-maxconnections"></b>: ' + row.MaxConn + '&emsp;'
                + '<b langtag="word-curconnections"></b>: ' + row.NowConn + '&emsp;'
                + '<b langtag="word-flowlimit"></b>: ' + row.Flow.FlowLimit + 'm&emsp;'
                + '<b langtag="word-ratelimit"></b>: ' + row.RateLimit + 'kb/s&emsp;'
                + '<b langtag="word-maxtunnels"></b>: ' + row.MaxTunnelNum + '&emsp;<br/><br/>'
                + '<b langtag="word-webusername"></b>: ' + escapeHtml(row.WebUserName) + '&emsp;'
                + '<b langtag="word-webpassword"></b>: ' + escapeHtml(row.WebPassword) + '&emsp;'
                + '<b langtag="word-basicusername"></b>: ' + escapeHtml(clientBasicValue(row, 'U')) + '&emsp;'
                + '<b langtag="word-basicpassword"></b>: ' + escapeHtml(clientBasicValue(row, 'P')) + '&emsp;<br/><br/>'
                + '<b langtag="word-crypt"></b>: <span langtag="word-' + escapeHtml(clientBasicValue(row, 'Crypt')) + '"></span>&emsp;'
                + '<b langtag="word-compress"></b>: <span langtag="word-' + escapeHtml(clientBasicValue(row, 'Compress')) + '"></span>&emsp;'
                + '<b langtag="word-connectbyconfig"></b>: <span langtag="word-' + escapeHtml(row.ConfigConnAllow) + '"></span>&emsp;<br/><br/>'
                + '<b langtag="word-commandclient"></b>: ' + clientCommandHtml(row)
        },
        //表格的列
        columns: [
            {{if eq true .isAdmin}}
            {
                checkbox: true,
                align: 'center',
                valign: 'middle'
            },
            {{end}}
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                visible: true//false表示不显示
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value) { return escapeHtml(value) }
            },
            {
                field: 'Version',//域值
                title: '<span langtag="word-version"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value) { return escapeHtml(value) }
            },
            {
                field: 'VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (!row.NoStore) {
                        return verifyKeyMaskHtml(value)
                    } else {
                        return '<span langtag="word-publicvkey"></span>'
                    }
                }
            },
            {
                field: 'Addr',//域值
                title: '<span langtag="word-address"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value) { return escapeHtml(value) }
            },
            {
                field: 'InletFlow',//域值
                title: '<span langtag="word-inletflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.InletFlow)
                }
            },
            {
                field: 'ExportFlow',//域值
                title: '<span langtag="word-exportflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.ExportFlow)
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-speed"></span>',//内容
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    return changeunit(row.Rate.NowRate) + "/S"
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-connect"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-online"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    var btn_group = '<div class="btn-group">'

                    {{if eq true .isAdmin}}
                    if (row.Status) {
                        btn_group += '<a onclick="submitform(\'stop\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 0})" class="btn btn-outline btn-warning"><i class="fa fa-pause"></i></a>'
                    } else {
                        btn_group += '<a onclick="submitform(\'start\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 1})" class="btn btn-outline btn-primary"><i class="fa fa-play"></i></a>'
                    }
                    btn_group += '<a onclick="submitform(\'delete\', \'{{.web_base_url}}/client/del\', {\'id\':' + row.Id
                    btn_group += '})" class="btn btn-outline btn-danger"><i class="fa fa-trash"></i></a>'
                    btn_group += '<a onclick="openClientBasicDialog(' + row.Id
                    btn_group += '); return false;" class="btn btn-outline btn-info"><i class="fa fa-key"></i></a>'
                    {{end}}

                    btn_group += '<a href="{{.web_base_url}}/client/edit?id=' + Number(row.Id)
                    btn_group += '" class="btn btn-outline btn-success"><i class="fa fa-edit"></i></a></div>'
                    return btn_group
                }
            },
            {
                field: 'show',//域值
                title: '<span langtag="word-show">',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    return '<div class="btn-group"><a href="{{.web_base_url}}/index/all?client_id=' + Number(row.Id)
                        + '" class="btn btn-outline btn-primary" langtag="word-tunnel"></a>'
                        + '<a href="{{.web_base_url}}/index/hostlist?client_id=' + Number(row.Id)
                        + '" class="btn btn-outline btn-success" langtag="word-host"></a></div>'
                }
            }
        ]
    });
</script>
